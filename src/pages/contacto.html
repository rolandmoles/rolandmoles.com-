<div class="min-h-screen pt-24 sm:pt-32 pb-16 sm:pb-24"><div class="max-w-[1200px] mx-auto px-4 sm:px-8 md:px-16"><div data-r="up" data-load style="--y:20px;--dur:.8s"><h1 class="text-4xl sm:text-5xl md:text-6xl mb-12 sm:mb-16 md:mb-20 tracking-tight">contacto_</h1><div class="grid grid-cols-1 md:grid-cols-2 gap-10 sm:gap-12 md:gap-16"><div class="space-y-16 text-sm tracking-tight"><div><h2 class="text-xl mb-6 text-primary tracking-tight">email_</h2><a href="mailto:{{email}}" class="text-base text-white/70 hover:text-primary transition-colors">{{email}}</a></div><div><h2 class="text-xl mb-6 text-primary tracking-tight">redes_</h2><div class="space-y-3"><a href="{{instagram}}" target="_blank" rel="noopener noreferrer" class="block text-white/50 hover:text-primary transition-colors group"><span class="group-hover:translate-x-1 transition-transform inline-block">instagram_</span></a><a href="{{linkedin}}" target="_blank" rel="noopener noreferrer" class="block text-white/50 hover:text-primary transition-colors group"><span class="group-hover:translate-x-1 transition-transform inline-block">linkedin_</span></a></div></div><div class="pt-8 border-t border-white/5"><p class="text-white/40 leading-relaxed text-xs">para propuestas de colaboración, incluir detalles sobre el proyecto, fechas previstas y contexto artístico</p></div></div><div><h2 class="text-xl mb-8 text-primary tracking-tight">mensaje_</h2><form class="space-y-6 text-sm tracking-tight" data-form="contacto" action="{{formspree}}" method="POST" novalidate><div><label for="name" class="block mb-2 text-xs text-white/40">nombre</label><input type="text" id="name" name="name" autocomplete="name" maxlength="120" class="w-full px-4 py-3 bg-white/5 border border-white/10 focus:border-primary focus:outline-none transition-colors text-white/80" required></div><div><label for="email" class="block mb-2 text-xs text-white/40">email</label><input type="email" id="email" name="email" autocomplete="email" maxlength="160" class="w-full px-4 py-3 bg-white/5 border border-white/10 focus:border-primary focus:outline-none transition-colors text-white/80" required></div><div><label for="message" class="block mb-2 text-xs text-white/40">mensaje</label><textarea id="message" name="message" rows="8" maxlength="5000" class="w-full px-4 py-3 bg-white/5 border border-white/10 focus:border-primary focus:outline-none transition-colors resize-none text-white/80" required></textarea></div><input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" class="hidden"><button type="submit" class="w-full px-8 py-4 bg-primary text-black hover:bg-primary/80 transition-all tracking-tight disabled:opacity-50 disabled:cursor-not-allowed">enviar_</button></form><template data-ok><p class="text-sm text-primary tracking-tight">mensaje enviado correctamente</p></template><template data-err><p class="text-sm text-red-400 tracking-tight">error al enviar. intenta de nuevo</p></template></div></div></div></div></div>
